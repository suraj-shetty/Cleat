# Builds, signs, notarises and staples Cleat, then publishes the DMG as a
# GitHub Release.
#
# Triggered by pushing a tag:   git tag -a v1.1.0 -m "Cleat 1.1.0" && git push origin v1.1.0
# Or manually from the Actions tab, giving the tag to build.
#
# Required repository secrets — see docs/CI-CD.md §1:
#   BUILD_CERTIFICATE_BASE64  base64 of a .p12 holding the Developer ID
#                             Application identity AND its private key
#   P12_PASSWORD              password on that .p12
#   KEYCHAIN_PASSWORD         any random string; unlocks the throwaway CI keychain
#   SIGN_IDENTITY             "Developer ID Application: Your Name (CYY72W5P5F)"
#   NOTARY_KEY_BASE64         base64 of the App Store Connect API .p8 key
#   NOTARY_KEY_ID             its Key ID
#   NOTARY_ISSUER_ID          its Issuer ID

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPMENT_TEAM: CYY72W5P5F

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "Expected a tag starting with 'v', got '$TAG'." >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "marketing=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      # Shared/BuildConfiguration.swift bakes the team ID into the XPC code-signing
      # requirement. A certificate from any other team produces an app whose helper
      # refuses every connection at runtime — a failure that would otherwise only
      # show up on a user's machine.
      - name: Assert the certificate's team matches Signing.xcconfig
        run: |
          set -euo pipefail
          TEAM=$(awk -F= '/^DEVELOPMENT_TEAM/{gsub(/[ \t]/,"",$2); print $2}' Config/Signing.xcconfig)
          [ -n "$TEAM" ] || { echo "No DEVELOPMENT_TEAM in Config/Signing.xcconfig"; exit 1; }
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "($TEAM)" || {
            echo "Signing identity is not from team $TEAM."
            echo "The helper would refuse XPC connections from this build."
            exit 1; }
          echo "Team $TEAM confirmed."

      # build-dmg.sh takes a notarytool keychain profile, so create one from the
      # App Store Connect API key rather than changing the script.
      - name: Prepare notarytool credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials ci \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarise, staple
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: ci
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: Scripts/build-dmg.sh

      # Each check here maps to a specific way this app fails in a user's hands.
      - name: Verify the shipped artefact
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release/Cleat.app
          TEAM="$DEVELOPMENT_TEAM"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "TeamIdentifier=$TEAM"
          codesign -dv --verbose=4 "$APP/Contents/MacOS/CleatHelper" 2>&1 \
            | grep -q "TeamIdentifier=$TEAM"

          # Gatekeeper's own verdict, as close as CI can get to it.
          spctl --assess --type execute --verbose=4 "$APP"

          # An unstapled DMG fails to open on a Mac that happens to be offline.
          xcrun stapler validate build/Cleat.dmg

          # A missing plist breaks SMAppService registration silently.
          test -f "$APP/Contents/Library/LaunchDaemons/com.cleat.helper.plist"

          echo "Artefact verified."

      - name: Name the DMG for the release
        id: dmg
        run: |
          set -euo pipefail
          NAME="Cleat-${{ steps.version.outputs.marketing }}.dmg"
          mv build/Cleat.dmg "build/$NAME"
          echo "path=build/$NAME" >> "$GITHUB_OUTPUT"
          shasum -a 256 "build/$NAME" | tee build/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Cleat-dmg
          path: |
            ${{ steps.dmg.outputs.path }}
            build/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.dmg.outputs.path }}" build/SHA256SUMS.txt \
            --title "Cleat ${{ steps.version.outputs.marketing }}" \
            --generate-notes

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
