name: Cleat
options:
  bundleIdPrefix: com.cleat
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "2600"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "$(ARCHS_STANDARD)"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

targets:
  Cleat:
    type: application
    platform: macOS
    sources:
      - path: Cleat
      - path: Shared
      - path: HelperSupport/com.cleat.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: CleatHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleat.app
        PRODUCT_NAME: Cleat
        INFOPLIST_FILE: Cleat/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cleat/Cleat.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  CleatHelper:
    type: tool
    platform: macOS
    sources:
      - path: CleatHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: CleatHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.cleat.helper
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: HelperSupport/CleatHelper.entitlements
        OTHER_LDFLAGS: "-sectcreate __TEXT __info_plist $(SRCROOT)/HelperSupport/Helper-Info.plist"
